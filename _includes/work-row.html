<article class="work-row" data-category="{{ include.e.category | escape }}" data-topic="{{ include.e.topic | escape }}"><div class="row-num">{{ include.number }}</div><div><div class="meta">{{ include.e.publisher | escape }} <span> / </span> {{ include.e.date | escape }}</div><h3>{% if include.e.url %}<a href="{{ include.e.url | escape }}" target="_blank" rel="noopener noreferrer">{{ include.e.title | escape }}<span aria-hidden="true"> ↗</span></a>{% else %}{{ include.e.title | escape }}{% endif %}</h3><p>{{ include.e.description | escape }}</p><div class="credit">{{ include.e.role | escape }}</div></div><span class="category-label">{{ include.e.category | escape }}</span></article>
